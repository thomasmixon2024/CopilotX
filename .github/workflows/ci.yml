name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Validate JSON files
        run: |
          node -e "for (const f of ['package.json','config/router.json','config/personas.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('JSON OK')"
      - name: Run tests
        run: npm test
